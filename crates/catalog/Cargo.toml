[package]
name = "photo-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
photo-core = { workspace = true }
log = { workspace = true }
# `functions` (no extra crates) lets the catalog register its Unicode
# case-folding SQL function, used for case-insensitive text matching.
rusqlite = { workspace = true, features = ["functions"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
