[package]
name = "photo-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
photo-catalog = { workspace = true }
photo-core = { workspace = true }
photo-decode = { workspace = true }
photo-develop = { workspace = true }
# Only for re-exporting the tone-curve shapes the curve editor plots, so the
# interface draws the very functions the pipeline renders with.
photo-color = { workspace = true }
photo-export = { workspace = true }
photo-imaging = { workspace = true }
photo-xmp = { workspace = true }
# Only for encoding and decoding the engine's own JPEG preview files.
image = { workspace = true }
log = { workspace = true }
rayon = { workspace = true }
# Tells whether two paths are the same folder, however they are spelled.
same-file = { workspace = true }
# Export presets are stored in the catalog as JSON.
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
photo-testkit = { workspace = true }
# Only so a test can do to a catalog what no catalog API does: plant develop
# settings written by a newer build, and hold the file locked from a second
# connection. Already in the workspace through photo-catalog.
rusqlite = { workspace = true }
tempfile = { workspace = true }
